name: Validate SAN3TY
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend JavaScript
        run: node --check public/script.js
      - name: Check Worker entrypoint JavaScript
        run: node --input-type=module --check < src/index.js
      - name: Check chatbot module JavaScript
        run: node --input-type=module --check < functions/api/chat.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc', 'utf8'))"
