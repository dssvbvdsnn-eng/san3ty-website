name: Validate SAN3TY
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend JavaScript
        run: node --check script.js
      - name: Check Cloudflare Pages Function JavaScript
        run: node --input-type=module --check < functions/api/chat.js
      - name: Validate package configuration
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
